<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TypeLab — Experiment with type.</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="brand-name">TypeLab</span>
        <span class="brand-tag">Experiment with type.</span>
      </div>
      <div class="top-actions">
        <button class="btn ghost icon" id="btn-undo" title="Undo (⌘Z)" aria-label="Undo">
          <svg viewBox="0 0 20 20" width="16" height="16"><path d="M7.5 4 3.5 8l4 4M4 8h7.5a4.5 4.5 0 0 1 0 9H9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Undo</span>
        </button>
        <button class="btn ghost icon" id="btn-redo" title="Redo (⇧⌘Z)" aria-label="Redo">
          <svg viewBox="0 0 20 20" width="16" height="16"><path d="M12.5 4l4 4-4 4M16 8H8.500a4.5 4.5 0 0 0 0 9H11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Redo</span>
        </button>
        <span class="sep"></span>
        <button class="btn ghost" id="btn-save" title="Save (⌘S)">Save<i class="dirty" id="dirty"></i></button>
        <button class="btn primary" id="btn-export">Export</button>
      </div>
    </header>

    <nav class="nav" id="nav" aria-label="Design categories"></nav>

    <main class="stage" id="stage">
      <div class="stage-bar" id="stage-bar"></div>
      <div class="stage-scroll" id="stage-scroll">
        <div id="style-cards" class="style-cards"></div>
        <div id="custom-wrap" class="custom-wrap" hidden>
          <textarea id="custom-text" rows="2" spellcheck="false" placeholder="Type anything…"></textarea>
        </div>
        <div id="preview" class="preview"></div>
      </div>
      <section class="inspector" id="inspector" hidden aria-label="Glyph inspector"></section>
    </main>

    <aside class="panel" id="panel" aria-label="Controls"></aside>

    <footer class="strip" id="strip" aria-label="Glyphs"></footer>
  </div>

  <div class="popover" id="export-pop" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="glyph-defs"></defs></svg>

  <script src="js/geom.js"></script>
  <script src="js/stroke.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/glyphs.js"></script>
  <script src="js/config.js"></script>
  <script src="js/diagram.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
